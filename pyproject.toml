[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hehahe-validation"
version = "0.1.0"
description = "Python validation framework for multi-scale oscillatory coupling biomechanics analysis"
authors = [
    { name = "Kundai Farai Sachikonye", email = "kundai.sachikonye@tum.de" },
]
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
keywords = [
    "biomechanics",
    "oscillatory",
    "coupling",
    "validation",
    "wearable-sensors",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    # Core scientific computing
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",

    # Signal processing
    "pywt>=1.4.1", # Wavelets

    # FIT file parsing
    "fitparse>=1.2.0",
    "python-fit>=0.2.0",

    # GPX/TCX/KML parsing
    "gpxpy>=1.5.0",
    "lxml>=4.9.0",
    "beautifulsoup4>=4.12.0",

    # Statistical analysis
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "pingouin>=0.5.3",     # Advanced statistics

    # Time series analysis
    "spectrum>=0.8.1", # Spectral analysis

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",

    # Data handling
    "h5py>=3.9.0",
    "pyarrow>=13.0.0",

    # Utilities
    "tqdm>=4.66.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "hypothesis>=6.87.0",

    # Jupyter
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0",
    "notebook>=7.0.0",

    # Code quality
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",

    # Documentation
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/kundaify/hehahe"
Documentation = "https://github.com/kundaify/hehahe/docs"
Repository = "https://github.com/kundaify/hehahe"

[tool.setuptools]
packages = ["validation"]

[tool.pytest.ini_options]
testpaths = ["validation/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=validation",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
