[package]
name = "hehahe"
version = "0.1.0"
edition = "2021"
authors = ["Kundai Farai Sachikonye <kundai.sachikonye@tum.de>"]
description = "Multi-scale oscillatory coupling framework for biomechanics analysis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kundaify/hehahe"
keywords = ["biomechanics", "oscillatory", "coupling", "wearable-sensors", "performance"]
categories = ["science", "mathematics", "command-line-utilities"]
rust-version = "1.70"

[lib]
name = "hehahe"
path = "src/lib.rs"

[[bin]]
name = "hehahe"
path = "src/main.rs"

[dependencies]
# Core numerical computing
ndarray = "0.15"
ndarray-stats = "0.5"
num-complex = "0.4"
num-traits = "0.2"
approx = "0.5"

# FFT and signal processing
rustfft = "6.1"
realfft = "3.3"

# FIT file parsing
fitparser = "0.4"

# Other data formats
gpx = "0.9"
quick-xml = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Command-line interface
clap = { version = "4.4", features = ["derive", "cargo"] }
indicatif = "0.17"
colored = "2.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Parallel processing
rayon = "1.8"

# File I/O
walkdir = "2.4"
memmap2 = "0.9"

# Statistics
statrs = "0.16"

# Configuration
config = "0.13"
toml = "0.8"

[dev-dependencies]
# Testing
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
approx = "0.5"
tempfile = "3.8"

# Benchmarking
dhat = "0.3"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
strip = false
debug = true

[[bench]]
name = "coupling_computation"
harness = false

[[bench]]
name = "fit_parsing"
harness = false

[[bench]]
name = "frequency_analysis"
harness = false

[features]
default = ["parallel"]
parallel = ["rayon"]
simd = []

